trigger:
  branches:
    include:
      - main

variables:
  - group: IdPicture-Secrets
  - name: buildConfiguration
    value: 'Release'
  - name: webAppName
    value: 'idpicture-api'
  - name: azureServiceConnection
    value: 'Azure-AppService-Connection'

stages:
- stage: BuildAndMigrate
  displayName: 'Build and Package'
  jobs:
  - job: BuildJob
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK 8.x'
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet Packages'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build Solution'
      inputs:
        command: 'build'
        projects: 'IdPicture.sln'
        configuration: '$(buildConfiguration)'
        arguments: '--no-restore'

    - script: |
        dotnet tool install --global dotnet-ef
        export PATH="$PATH:$HOME/.dotnet/tools"
        dotnet ef database update \
          --project MyId.Persistence/MyId.Persistence.csproj \
          --startup-project IdPicture/IdPicture.csproj \
          --connection "$(DefaultConnection)"
      displayName: 'Apply Entity Framework Migrations to Azure SQL'

    - task: DotNetCoreCLI@2
      displayName: 'Publish Web API'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'IdPicture/IdPicture.csproj'
        configuration: '$(buildConfiguration)'
        arguments: '--no-restore --output $(Build.ArtifactStagingDirectory)/publish'
        zipAfterPublish: true

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Build Artifacts'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/publish'
        artifact: 'drop'

- stage: Deploy
  displayName: 'Deploy Web API'
  dependsOn: 'BuildAndMigrate'
  condition: succeeded('BuildAndMigrate')
  jobs:
  - deployment: DeployJob
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'Production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download Build Artifacts'
            inputs:
              buildType: 'current'
              artifact: 'drop'
              targetPath: '$(Pipeline.Workspace)/drop'

          - task: AzureWebApp@1
            displayName: 'Azure App Service Deploy'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webApp'
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)/drop/*.zip'
              appSettings: '-ConnectionStrings:DefaultConnection "$(DefaultConnection)"'